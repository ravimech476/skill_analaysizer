analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Screens reach the API through the small helpers in widgets/common.dart
    # (runAction, toast, confirm). Those take the BuildContext and check
    # `context.mounted` themselves before touching it, which the analyzer cannot
    # see through — so every call after an await is reported even though it is
    # guarded. Turning the rule off here keeps the guard in one reviewed place
    # instead of scattering `if (!context.mounted) return;` through every screen.
    use_build_context_synchronously: false
