org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The project sits on D: while the pub cache holding the plugins' Kotlin sources sits
# on C:. Kotlin's incremental compiler relativises those paths against the build
# directory, and relativising across Windows drive letters throws — every plugin that
# ships Kotlin (image_picker, url_launcher, shared_preferences) failed to compile with
# "Could not close incremental caches". Non-incremental compilation has no such step.
# It costs a little build time; moving the project and the pub cache onto one drive
# would let this be removed.
kotlin.incremental=false
