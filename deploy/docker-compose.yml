# Production stack for one server:  docker compose --env-file .env up -d --build
#   web     Caddy: HTTPS, the React app, and /api → api
#   api     Go API (runs migrations on start)
#   db      PostgreSQL 17 (data in the db-data volume)
#   backup  nightly pg_dump + uploaded files archive into ./backups
name: skills-analyzer

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skills_analyzer
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skills -d skills_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ../backend
      args:
        VERSION: ${APP_VERSION:-1.0.0}
    image: skills-analyzer-api:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://skills:${POSTGRES_PASSWORD}@db:5432/skills_analyzer?sslmode=disable
      FILES_DIR: /app/storage
      # Only the Caddy container (on the internal network) may set X-Forwarded-For.
      TRUSTED_PROXIES: 172.28.0.0/16
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${SITE_ADDRESS}}
    volumes:
      - uploads:/app/storage
    networks: [internal]

  web:
    build:
      context: ../web
    image: skills-analyzer-web:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (your domain, or :80 for local testing)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data # certificates
      - caddy-config:/config
    networks: [internal]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: skills
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: skills_analyzer
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh", "loop"]
    networks: [internal]

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16
